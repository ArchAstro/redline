name: Feature request
description: Suggest an improvement to Redline.
title: "[feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem should this solve?
      description: Describe the workflow or limitation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: What should Redline do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: If you have tried a workaround or another tool, describe it.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, links, or implementation notes.
