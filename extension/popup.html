<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Redline</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <header class="masthead">
      <div class="brand"><span class="mark" aria-hidden="true">R</span><strong>Redline</strong></div>
      <span id="connection-status" class="connection" role="status">Checking</span>
    </header>

    <main>
      <section class="site-panel" aria-labelledby="site-title">
        <div class="section-label" id="site-title">Current site</div>
        <div id="origin" class="origin">No website open</div>
        <p id="site-message" class="message" role="status"></p>
        <div class="site-actions">
          <button id="enable-site" class="primary">Enable Redline on this site</button>
          <button id="disable-site" class="secondary" hidden>Disable on this site</button>
        </div>
      </section>

      <section class="visual-panel" aria-labelledby="visual-title">
        <div class="toggle-row">
          <div>
            <div class="section-label" id="visual-title">Full visual context</div>
            <p>Attach a visible-tab screenshot to new feedback. This asks Chrome for access to all websites; Redline captures only an enabled site's active tab when you submit. After turning it off, you may need to enable sites again.</p>
          </div>
          <label class="switch" aria-label="Full visual context">
            <input id="full-visual" type="checkbox">
            <span aria-hidden="true"></span>
          </label>
        </div>
      </section>

      <section class="feedback-panel" aria-labelledby="feedback-title">
        <div class="feedback-head">
          <div>
            <div class="section-label" id="feedback-title">Feedback</div>
            <div id="counts" class="counts"></div>
          </div>
          <button id="refreshShot" class="quiet" title="Use a fresh screenshot on the next submission">Refresh shot</button>
        </div>
        <div class="filters" aria-label="Feedback filter">
          <button data-filter="pending" class="active">Pending</button>
          <button data-filter="all">All</button>
        </div>
        <div id="list" class="list"></div>
      </section>
    </main>

    <footer>
      <button id="disconnect" class="quiet">Disconnect browser</button>
      <button id="disable-everywhere" class="quiet">Disable everywhere</button>
      <button id="clear-data" class="danger">Clear all data</button>
    </footer>

    <script src="popup.js"></script>
  </body>
</html>
